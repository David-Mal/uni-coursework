<div class="login-box">
  <h2>Login to Manage News</h2>

  @if (error) {
    <p class="error">{{ error }}</p>
  }

  <div class="form-group">
    <input type="text" [(ngModel)]="username" placeholder="Username" required>
  </div>
  <div class="form-group">
    <input type="password" [(ngModel)]="password" placeholder="Password" required
           (keyup.enter)="login()">
  </div>
  <button (click)="login()" [disabled]="loading || !username || !password">
    {{ loading ? 'Logging in…' : 'Login' }}
  </button>
  <a routerLink="/" class="back-link">&larr; Back to News</a>
</div>
