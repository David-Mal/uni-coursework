[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "udllm-labs-2026"
version = "1.0.0"
description = "Laboratory materials for Understanding and Developing Large Language Models"
requires-python = ">=3.10,<3.15"
dependencies = [
  "httpx==0.28.1",
  "mcp[cli]==2.2.0",
  "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
  "ipykernel==7.4.0",
  "jupyterlab==4.6.4",
  "nbclient==0.11.0",
  "pytest==9.1.1",
]

[tool.setuptools]
packages = [
  "udllm_labkit",
  "scripts",
  "Lab01"
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = [
  "udllm_labkit/tests",
  "Lab01/tests"
]
